  <g stroke="#9a8f80" stroke-width="2"><line x1="336" y1="196" x2="368" y2="196"/><line x1="336" y1="204" x2="368" y2="204"/><line x1="336" y1="212" x2="368" y2="212"/></g>
  <path d="M352 226 Q350 252 330 262 Q318 268 300 266" stroke="#111" stroke-width="2" fill="none"/>
  <rect x="294" y="262" width="10" height="7" fill="#222"/>
