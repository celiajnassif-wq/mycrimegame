    <line x1="58" y1="38" x2="90" y2="38"/><line x1="58" y1="48" x2="90" y2="48"/><line x1="58" y1="58" x2="90" y2="58"/><line x1="58" y1="68" x2="90" y2="68"/><line x1="58" y1="78" x2="90" y2="78"/><line x1="58" y1="88" x2="90" y2="88"/><line x1="58" y1="98" x2="90" y2="98"/><line x1="58" y1="108" x2="90" y2="108"/><line x1="58" y1="118" x2="90" y2="118"/><line x1="58" y1="128" x2="90" y2="128"/>
