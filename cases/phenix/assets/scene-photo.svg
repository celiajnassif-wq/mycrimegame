  <rect x="40" y="120" width="40" height="44" fill="#57524a" stroke="#1a1714" stroke-width="2"/>
  <rect x="58" y="116" width="26" height="48" fill="#6a645b" stroke="#1a1714" transform="rotate(-28 58 140)"/>
  <circle cx="60" cy="142" r="5" fill="#9a948a"/>
