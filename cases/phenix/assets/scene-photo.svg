  <line x1="118" y1="232" x2="196" y2="214" stroke="#8a7a58" stroke-width="5"/>
  <circle cx="198" cy="213" r="7" fill="#5a503e"/>
  <ellipse cx="104" cy="238" rx="7" ry="2.5" fill="#1b1310"/>
