<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e5850"/><stop offset="1" stop-color="#47423b"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3530"/><stop offset="1" stop-color="#211e1b"/></linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.55" r="0.75"><stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
  </defs>
  <rect width="400" height="210" fill="url(#wall)"/>
  <rect y="200" width="400" height="100" fill="url(#floor)"/>
  <g stroke="#2a2621" stroke-width="1" opacity="0.5"><line x1="0" y1="232" x2="400" y2="226"/><line x1="0" y1="262" x2="400" y2="256"/><line x1="90" y1="200" x2="60" y2="300"/><line x1="200" y1="200" x2="196" y2="300"/><line x1="310" y1="200" x2="336" y2="300"/></g>
