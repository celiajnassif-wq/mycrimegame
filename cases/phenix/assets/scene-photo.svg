  <rect x="110" y="70" width="120" height="6" fill="#2b2622"/>
  <g fill="#3d4a3c"><rect x="118" y="50" width="10" height="20"/><rect x="134" y="46" width="12" height="24"/><rect x="152" y="54" width="9" height="16"/><rect x="200" y="48" width="12" height="22"/><rect x="216" y="52" width="9" height="18"/></g>
  <!-- enlarger -->
  <rect x="262" y="150" width="70" height="10" fill="#1c1a17"/>
  <rect x="292" y="48" width="8" height="104" fill="#26231f"/>
  <path d="M262 92 L300 84 L300 118 L262 122 Z" fill="#2f2b26" stroke="#111"/>
  <rect x="266" y="120" width="18" height="12" fill="#1c1a17"/>
  <path d="M268 132 L250 150 L300 150 L284 132 Z" fill="#d9d2c0" opacity="0.35"/>
  <!-- bench and sink with trays -->
  <rect x="236" y="160" width="164" height="10" fill="#1d1a17"/>
  <rect x="244" y="170" width="8" height="40" fill="#1a1714"/>
  <rect x="384" y="170" width="8" height="40" fill="#1a1714"/>
  <rect x="120" y="158" width="100" height="14" fill="#2a2621"/>
  <g fill="#c8c1b2" opacity="0.85"><rect x="126" y="152" width="26" height="6"/><rect x="157" y="152" width="26" height="6"/><rect x="188" y="152" width="26" height="6"/></g>
  <!-- body chalk outline -->
  <path d="M140 278 Q150 250 176 246 L196 238 Q212 234 222 244 L248 248 Q262 252 258 264 L236 268 L214 286 L176 290 Z" fill="none" stroke="#e8e2d4" stroke-width="2.4" stroke-dasharray="6 4"/>
